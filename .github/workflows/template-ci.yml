name: Template CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: template-template-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  template-validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: binary-default
            crate_type: bin
            license: MIT
            use_tokio: true
            use_tracing: true
            use_axum: false
            use_sqlx: false
            use_redis: false
            use_reqwest: false
            use_config: false
          - name: binary-axum
            crate_type: bin
            license: MIT
            use_tokio: true
            use_tracing: true
            use_axum: true
            use_sqlx: false
            use_redis: false
            use_reqwest: false
            use_config: false
          - name: binary-axum-no-tracing
            crate_type: bin
            license: MIT
            use_tokio: false
            use_tracing: false
            use_axum: true
            use_sqlx: false
            use_redis: false
            use_reqwest: false
            use_config: false
          - name: library
            crate_type: lib
            license: Apache-2.0
            use_tokio: false
            use_tracing: false
            use_axum: false
            use_sqlx: false
            use_redis: false
            use_reqwest: false
            use_config: false
          - name: binary-minimal
            crate_type: bin
            license: MIT
            use_tokio: false
            use_tracing: false
            use_axum: false
            use_sqlx: false
            use_redis: false
            use_reqwest: false
            use_config: false
          - name: binary-integrations
            crate_type: bin
            license: MIT
            use_tokio: false
            use_tracing: true
            use_axum: false
            use_sqlx: true
            use_redis: true
            use_reqwest: true
            use_config: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate commit message format
        run: |
          python3 -m py_compile .commit-message.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          printf '%s\n\n%s\n\n%s\n' '♻️ refactor(parser): simplify token handling' 'Explain why the parser change is needed.' 'Refs: #123' > /tmp/commit-message
          python3 .commit-message.py /tmp/commit-message
          printf '%s\n' ':recycle: refactor(parser): simplify token handling' > /tmp/shortcode-message
          python3 .commit-message.py /tmp/shortcode-message
          printf '%s\n' 'refactor(parser): missing emoji' > /tmp/invalid-commit-message
          if python3 .commit-message.py /tmp/invalid-commit-message; then
            echo "Invalid commit header unexpectedly passed"
            exit 1
          fi
      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate
      - name: Generate project
        run: |
          mkdir -p "${{ runner.temp }}/smoke-${{ matrix.name }}"
          cargo generate --path . --name smoke-${{ matrix.name }}
          --define author_name="Tilt <git@tilt.ninja>"
          --define description="Generated template smoke test"
          --define github_username=tiltful
          --define license=${{ matrix.license }}
          --define copyright_holder=Tilt
          --define copyright_year=2026
          --define use_tokio=${{ matrix.use_tokio }}
          --define use_tracing=${{ matrix.use_tracing }}
          --define use_axum=${{ matrix.use_axum }}
          --define use_sqlx=${{ matrix.use_sqlx }}
          --define use_redis=${{ matrix.use_redis }}
          --define use_reqwest=${{ matrix.use_reqwest }}
          --define use_config=${{ matrix.use_config }}
          --${{ matrix.crate_type }}
          --silent --destination ${{ runner.temp }}/smoke-${{ matrix.name }} --vcs none
      - name: Verify generated layout
        run: |
          project="${{ runner.temp }}/smoke-${{ matrix.name }}"
          test -f "$project/Cargo.toml"
          test -f "$project/LICENSE"
          test -f "$project/.env.example"
          test -f "$project/cliff.toml"
          test ! -e "$project/LICENSE-MIT"
          test ! -e "$project/LICENSE-APACHE"
          test ! -e "$project/cargo-generate.toml"
          test -f "$project/.github/workflows/ci.yml"
          test ! -e "$project/.github/workflows/template-ci.yml"
          test ! -e "$project/tests/test_commit_message.py"
          test ! -d "$project/scripts"
          test -f "$project/.commit-message.py"
          ! grep -Eq '<GITHUB_USER>|<PROJECT_NAME>' "$project/cliff.toml"
          if [ "${{ matrix.license }}" = "Apache-2.0" ]; then
            test -f "$project/NOTICE"
          else
            test ! -e "$project/NOTICE"
          fi
          if [ "${{ matrix.crate_type }}" = "lib" ]; then
            test ! -e "$project/.github/workflows/release.yml"
            test -f "$project/src/lib.rs"
            test ! -e "$project/src/main.rs"
            test ! -e "$project/Dockerfile"
            ! grep -q '^\[tasks.run\]' "$project/Makefile.toml"
            ! grep -q '^\[tasks.docker-build\]' "$project/Makefile.toml"
          else
            test -f "$project/.github/workflows/release.yml"
            ! grep -q '__PROJECT_NAME__' "$project/.github/workflows/release.yml"
            grep -q 'smoke-${{ matrix.name }}' "$project/Cargo.toml"
            test -f "$project/src/main.rs"
            test ! -e "$project/src/lib.rs"
            test -f "$project/Dockerfile"
            grep -q '^\[tasks.run\]' "$project/Makefile.toml"
            grep -q '^\[tasks.docker-build\]' "$project/Makefile.toml"
          fi
          python3 - <<'PY'
          import pathlib
          import tomllib
          project = pathlib.Path("${{ runner.temp }}/smoke-${{ matrix.name }}")
          for name in ("Cargo.toml", "Makefile.toml", "cliff.toml", "release.toml", "deny.toml", ".committed.toml", "rust-toolchain.toml"):
              with (project / name).open("rb") as file:
                  tomllib.load(file)
          PY
      - name: Format
        run: cargo fmt --manifest-path ${{ runner.temp }}/smoke-${{ matrix.name }}/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path ${{ runner.temp }}/smoke-${{ matrix.name }}/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path ${{ runner.temp }}/smoke-${{ matrix.name }}/Cargo.toml --all-targets -- --deny warnings
      - name: Test
        run: cargo test --manifest-path ${{ runner.temp }}/smoke-${{ matrix.name }}/Cargo.toml
      - name: Rustdoc
        run: cargo doc --manifest-path ${{ runner.temp }}/smoke-${{ matrix.name }}/Cargo.toml --no-deps
      - name: Build binary Docker image
        if: matrix.crate_type == 'bin'
        run: docker build -t smoke-template:ci ${{ runner.temp }}/smoke-${{ matrix.name }}

  dependency-security:
    name: Dependency security and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate
      - name: Generate security fixture
        run: |
          mkdir -p "${{ runner.temp }}/security-smoke"
          cargo generate --path . --name security-smoke
          --define author_name="Tilt <git@tilt.ninja>"
          --define description="Security validation fixture"
          --define github_username=tiltful
          --define license=MIT
          --define copyright_holder=Tilt
          --define copyright_year=2026
          --define use_tokio=true
          --define use_tracing=true
          --define use_axum=false
          --define use_sqlx=false
          --define use_redis=false
          --define use_reqwest=false
          --define use_config=false
          --bin --silent --destination ${{ runner.temp }}/security-smoke --vcs none
      - name: Resolve dependencies
        working-directory: ${{ runner.temp }}/security-smoke
        run: cargo generate-lockfile
      - name: Install security tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      - name: Audit advisories
        working-directory: ${{ runner.temp }}/security-smoke
        run: cargo audit
      - name: Check licenses, bans and sources
        working-directory: ${{ runner.temp }}/security-smoke
        run: cargo deny check
      - name: Generate CycloneDX SBOM
        working-directory: ${{ runner.temp }}/security-smoke
        run: cargo cyclonedx --format json --override-filename sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: ${{ runner.temp }}/security-smoke/sbom.json
          if-no-files-found: error
