# Conventional Emoji Commits: <gitmoji> <type>(<scope>): <description>
[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented here.\n"
body = """{% raw %}
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## Unreleased
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}
{% endraw %}"""
trim = true
postprocessors = [
  { pattern = '<REPO>', replace = 'https://github.com/{{github_username}}/{{project-name}}' },
]

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = ' +$', replace = "" },
  { pattern = ' +', replace = " " },
]
commit_parsers = [
  { message = "^(✨|:sparkles:) feat", group = "<!-- 0 -->✨ Features" },
  { message = "^(🐛|🩹|🚑️|:bug:|:adhesive_bandage:|:ambulance:) fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^(📝|:memo:|📚) docs", group = "<!-- 2 -->📝 Documentation" },
  { message = "^(⚡️?|:zap:) perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^(♻️|:recycle:) refactor", group = "<!-- 4 -->♻️ Refactoring" },
  { message = "^(🧪|:test_tube:|✅|:white_check_mark:) test", group = "<!-- 5 -->🧪 Testing" },
  { message = "^(🎨|:art:|💄|:lipstick:) style", group = "<!-- 6 -->🎨 Styling" },
  { message = "^(🛠️|📦️|:hammer:|:package:) build", group = "<!-- 7 -->📦 Build" },
  { message = "^(👷|:construction_worker:|🤖|💚|:green_heart:) ci", group = "<!-- 8 -->👷 CI" },
  { message = "^(🔧|:wrench:|🧹|:broom:) chore", group = "<!-- 9 -->🔧 Miscellaneous" },
  { message = "^(⏪️?|:rewind:) revert", group = "<!-- 10 -->⏪ Reverts" },
  { message = "^(🚀|:rocket:) chore\\(release\\)", skip = true },
  { message = "^(⬆️|:arrow_up:) chore\\(deps", skip = true },
]
filter_commits = false
sort_commits = "oldest"
