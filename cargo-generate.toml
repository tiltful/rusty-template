[template]
cargo_generate_version = ">=0.10.0"

[placeholders.author_name]
type = "string"
prompt = "🧑‍💻 Author name and email (e.g., 'John Doe <john@example.com>')"
default = "t1ltxz-gxd <git@t1ltxz.ninja>"

[placeholders.description]
type = "string"
prompt = "✏️ Project description"
default = ""

[placeholders.github_username]
type = "string"
prompt = "😎 GitHub username"
regex = "^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$"
default = "t1ltxz-gxd"

[placeholders.repository_name]
type = "string"
prompt = "🔥 Repository name"
default = "{{project-name}}"

[placeholders.license]
type = "string"
prompt = "⭐ License"
choices = ["MIT", "Apache-2.0", "GPL-3.0", "BSD-3-Clause"]
default = "MIT"

[conditional.'license == "MIT"']
ignore = ["LICENSE-APACHE"]

[conditional.'license == "Apache-2.0"']
ignore = ["LICENSE-MIT"]

[hooks]
init = ["scripts/init.rhai"]
pre = ["scripts/pre.rhai"]
post = ["scripts/post.rhai"]
