default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: commit-message
        name: Gitmoji + Conventional Commit message
        entry: python3 .commit-message.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
      - id: fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
      - id: clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- --deny warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
